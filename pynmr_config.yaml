# PyNMR Config file, YAML
---
settings:
    theme: system                 # GUI theme: system (follow OS), light, or dark
    default_channel: Proton5T     # Default from channels listed above
    daq_type: FPGA              # Select DAQ mode (FPGA, NIDAQ or Test)
    test_signal: utils/d_signal_event.txt  # signal to use for test mode
    event_dir: data             # Directory to put eventfiles in, relative to main.py or absolute
    te_dir: te                  # Directory to put te files in, relative to main.py or absolute
    log_dir: log                # Directory to put log files in, relative to main.py or absolute
    ss_dir: screens               # Directory to put screenshots files in, screenshots not taken if False
    session_file: session
    history_file: history
    steps: 512                  # Frequency points per sweep (must match for test sweeps, set to 512 otherwise)
    num_per_chunk: 64           # Number of sweeps per chunk (IntSweepCycle from FPGA manual)
    tune_per_chunk:  32         # Number of sweeps per chunk to take in tune mode
    epics_settings:
        enable: false       # If false, doesn't attempt to contact EPICS server
        monitor_time: 5            # Time between calls to get EPICS data
        timeout: 1
        epics_temp: TGT:PT12:Bath_Top_T      # EPICS channel of temp to use as default 
        beam_current: scaler_calc1      # EPICS channel of beam current
        current_threshold: 3     # Current in nA at which we consider beam to be on
    fpga_settings:    
        #ip: 192.168.0.70       # Device IP address (str)
        #ip: 129.57.160.2        # Device IP address (str) Hall B Proton
        ip: 192.168.0.72        # Device IP address (str) Hall B Deuteron
        port: 1028              # Device port  (int)
        tcp_buffer: 1460        # Default TCP buffer size  (int)
        dwell: 10               # Settle time in usec between frequency switch and ADC read (int) (was 10)
        per_point: 2            # Samples taken and averaged at each frequency point of a sweep (int)
        timeout_run: 10         # TCP timeout for running sweeps
        timeout_tune: 1         # TCP timeout for tune
        timeout_check: 1        # TCP timeout for check
        timeout_udp: 1          # Timeout for udp commands
        adc_drate1: true        # ADC data rate settings, see manual
        adc_drate0: true
        adc_fpath: false        # ADC fpath setting, see manual
        phase_cal: 211692085    # Conversion int to divide phase ADC values by to get max of 1
        diode_cal: 829421       # Conversion int to divide diode ADC values by to get max of 1
#       #phase_cal: 1672129    # Conversion int to divide phase ADC values by to get max of 1
#       #diode_cal: 1672129       # Conversion int to divide diode ADC values by to get max of 1
        test_freqs: false       # Send test frequencies to FPGA
        adc_test: false         # ADC test mode flag
        phase_adc_number: 1         # Which ADC channel will be phase signal? 1 or 2
    nidaq_settings:
        phase_chan: Dev2/ai0
        diode_chan: Dev2/ai1
        ao_chan: Dev2/ao0
        pretris: 10             # Number of pretriangles
        time_per_pt: 29         # Dwell time at frequency, usecs
        settling_ratio: 0.5     # Where in the dwell time the read occurs (0 to 1)     
    RS_settings:
        ip: 192.168.0.50             # R&S RF generator IP
        #ip: 129.57.160.8              # R&S RF generator IP Hall B
        port: 5025 
        timeout: 2              # Telnet timeout in secs
    uWave_settings:
        enable: false         # Turn on uWave controls
        monitor_time: .4         # How long to wait between reading frequency when on monitor in s
        counter_pv: TGT:uWave:Freq      # EPICS PV for frequency counter reading (Hz)
        power_meter_pv: TGT:uWave:Power  # EPICS PV for power meter reading (W)
        lj-ip: 129.57.160.6     # LabJack device IP
        relay-ip: 129.57.161.12     # Relay device IP, 129.57.161.123 is pt-eio-relay
        eio_method: 'ip'            # 'ip' or 'lj'
    temp_settings:
        enable: false           # Turn on or off temp monitor tab
        ip: 129.57.160.6       # R&S supply IP   
        monitor_time: 60       # seconds
    shim_settings:
        enable: false
        ip: 129.57.160.4       # R&S supply IP
        port: 5025 
        timeout: 2  
        line_resistance: 0.3     # Ohms
    explorer:
        enable: false
    compare_tab:
        enable: false
    rf_switch:
        ip: 129.57.161.17      
        port: 23
        timeout: 2  
    fm_settings:
        enable: false
        ip: 129.57.160.12       # R&S supply IP
        port: 1234
        timeout: 2     
        addr: 10                # GPIB address    
    analysis:
        base_def: 0             # index of default baseline subtraction method      
        sub_def: 0              # index of default fit subtraction method   
        res_def: 0              # index of default results analysis method   
        wings:                  # default bounds for fit wings, must be four numbers between 0 and 1
            - 0.01
            - 0.30
            - 0.70
            - 0.99
        sum_range:              # default bounds for range integration option
            - 0.35
            - 0.65
        d_fit_params:           # initial parameters for Dulya fits
            A : 0.03
            G : -0.003
            r : 0.99
            wQ : 0.025
            wL : 31.83
            eta : 0.09
            xi : -0.1
epics_reads:                    # EPICS channels to read: key is channel name, value is string to display
    TGT:PT12:Bath_LL: Bath Level
    TGT:PT12:VaporPressure_T: Vapor Temp (K)
    TGT:PT12:Bath_Top_T: Bath Top (K)
    TGT:PT12:Bath_Bottom_T: Bath Bottom (K)
    TGT:PT12:NMR_T: Tank Temp (K)
    TGT:PT12:Bath_HTR_lvl: Bath Heater
    TGT:PT12:Fridge_F: Main Flow (slpm)
    TGT:PT12:Separator_F: Sep Flow (slpm)
    B_SOL:MPS:I_ZFCT: Solenoid Current (A)
    scaler_calc1: Beam Current (nA)
    TGT:PT12:Target_Dose: Dose (e/cm^2)
epics_writes:                   # Dict of channels to write, key is channel, value is attribute of Event class 
    TGT:PT12:Polarization: pol 
    TGT:PT12:NMR_Area: area
    TGT:PT12:NMR_CC: cc
    TGT:PT12:NMR_Time: stop_stamp  
    TGT:PT12:uwave_Freq: uwave_freq
    TGT:PT12:uwave_Power: uwave_power
    TGT:PT12:ShimCurrent_A: shimA
    TGT:PT12:ShimCurrent_B: shimB
    TGT:PT12:ShimCurrent_C: shimC
    TGT:PT12:ShimCurrent_D: shimD

# Profiles override the base settings above via deep merge; channels are replaced entirely.
# Launch without -p to select a profile from the startup dialog.
profiles:
    Test:
        channels:
            Deuteron5T:
                name: Deuteron5T
                species: deuteron
                cent_freq: 32.7
                mod_freq: 400.0
                power: 400.0
                sweep_file: tri
            Proton5T:
                name: Proton5T
                species: proton
                cent_freq: 212.882
                mod_freq: 400.0
                power: 450.0
                sweep_file: tri
        settings:
            default_channel: Deuteron5T
            daq_type: Test
            event_dir: data
            session_file: session
            history_file: history
            analysis:
                wings:
                    - 0.01
                    - 0.25
                    - 0.75
                    - 0.99
                d_fit_params:
                    wL: 32.7
                    G: -0.0003
    # --- nmr_sim hook: simulated deuteron Test profile (see nmr_sim/README.md).
    # Remove this whole profile to drop nmr_sim. Check it with: python -m nmr_sim
    TestSim:
        channels:
            Deuteron5T:
                name: Deuteron5T
                species: deuteron
                cent_freq: 32.7
                mod_freq: 400.0
                power: 400.0
                sweep_file: tri
        settings:
            default_channel: Deuteron5T
            daq_type: Test
            test_source: sim            # 'sim' = nmr_sim; anything else = replay of test_signal
            event_dir: data
            session_file: sim_session   # kept apart from the replay Test session/history
            history_file: sim_history
            analysis:
                wings:
                    - 0.01
                    - 0.25
                    - 0.75
                    - 0.99
                d_fit_params:           # start near the ND3 preset the sim uses
                    A: 0.038
                    G: -0.001
                    r: 1.05
                    wQ: 0.0273
                    wL: 32.7
                    eta: 0.116
                    xi: 0.0
            nmr_sim:                    # every key is optional; defaults in nmr_sim/params.py
                seed: 20261005          # null = new random seed each launch (printed and logged)
                speed: 60               # simulated seconds per wall second
                field_T: 5.00306        # 6.536 MHz/T * 5.00306 T = 32.700 MHz (null = on tune freq)
                te_temp_K: 1.0
                material: deuterated ammonia (Dec 2024)
                calibration:            # phase-signal peak height at a given P (sets chi scale)
                    P: 0.0019
                    peak_phase_V: 8.0e-4
                noise:
                    sigma_phase_V: 1.5e-3   # per sweep; an event of N sweeps has sigma/sqrt(N)
                    sigma_diode_V: 1.0e-3
                truth_log_dir: log      # log/nmr_sim_truth_<UTC>.csv, one row per chunk
                timeline:               # durations in simulated s (wall s = sim s / speed)
                    - {name: baseline, kind: hold, P: te, duration_s: 7200, line_offset_MHz: 1.2}  # 2 min wall: take baseline here
                    - {name: te, kind: hold, P: te, duration_s: 3600}
                    - {name: spinup, kind: spinup, P_inf: 0.40, tau_s: 3600, duration_s: 21600}
                    - {name: relax, kind: relax, T1_s: 10800, duration_s: null}
    # --- end nmr_sim hook
    Deuteron:
        channels:
            Deuteron5T:
                name: Deuteron5T
                species: deuteron
                cent_freq: 32.7
                mod_freq: 400.0
                power: 400.0
                sweep_file: tri
            Deuteron5T-800kHz:
                name: Deuteron5T-800kHz
                species: deuteron
                cent_freq: 32.7
                mod_freq: 800.0
                power: 400.0
                sweep_file: tri
        settings:
            default_channel: Deuteron5T
            daq_type: FPGA
            event_dir: data-d
            session_file: deuteron_session
            history_file: deuteron_history
            #fpga_settings:
                #ip: 129.57.161.8
           # RS_settings:
               # ip: 129.57.160.3
            analysis:
                wings:
                    - 0.01
                    - 0.25
                    - 0.75
                    - 0.99
                d_fit_params:
                    wL: 32.7
                    G: -0.0003
    Proton:
        channels:
            Proton5T:
                name: Proton5T
                species: proton
                cent_freq: 212.882
                mod_freq: 400.0
                power: 450.0
                sweep_file: tri
            Proton5T-500mV:
                name: Proton5T-500mV
                species: proton
                cent_freq: 212.882
                mod_freq: 400.0
                power: 500.0
                sweep_file: tri
            Proton5T-550mV:
                name: Proton5T-550mV
                species: proton
                cent_freq: 212.882
                mod_freq: 400.0
                power: 550.0
                sweep_file: tri
        settings:
            default_channel: Proton5T
            daq_type: FPGA
            event_dir: data-p
            session_file: proton_session
            history_file: proton_history
            #fpga_settings:
              #  ip: 129.57.160.2
            #RS_settings:
              #  ip: 129.57.160.8
            analysis:
                wings:
                    - 0.01
                    - 0.30
                    - 0.70
                    - 0.99
                d_fit_params:
                    wL: 31.83
                    G: -0.003